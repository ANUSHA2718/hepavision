<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}HepaVision{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="ambient-bg">
  <div class="med-grid"></div>
  <div class="radiology-ring ring-1"></div>
  <div class="radiology-ring ring-2"></div>
  <div class="radiology-ring ring-3"></div>
  <span class="particle"></span><span class="particle"></span><span class="particle"></span>
  <span class="particle"></span><span class="particle"></span>
</div>

<nav class="pub-nav">
  <a href="{{ url_for('home') }}" class="pub-brand">
    <span class="mark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7 3c-2.5 2-4 5.2-4 8.5C3 16.6 6.8 21 12 21s9-4.4 9-9.5c0-3.3-1.5-6.5-4-8.5-.3 2.8-1.6 4.4-3 5.5-1.6 1.3-2.8 2.6-2.8 5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    HepaVision
  </a>
  <button class="nav-toggle" id="navToggle"><i class="bi bi-list"></i></button>
  <div class="pub-links" id="pubLinks">
    <a href="{{ url_for('home') }}" class="{{ 'active' if active=='home' else '' }}">Home</a>
    <a href="{{ url_for('about') }}" class="{{ 'active' if active=='about' else '' }}">About</a>
    <a href="{{ url_for('login') }}" class="{{ 'active' if active=='login' else '' }}">Login</a>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-sm">Analyze CT Scan</a>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="site-footer">
  <p>HepaVision &mdash; Research &amp; Educational Prototype. Not a certified medical device. Not for clinical diagnosis or treatment decisions.</p>
</footer>

<script>
document.getElementById('navToggle').addEventListener('click', () => {
  document.getElementById('pubLinks').classList.toggle('open');
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>

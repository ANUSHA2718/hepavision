<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}HepaVision{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="{{ url_for('home') }}" class="brand">
      <span class="mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7 3c-2.5 2-4 5.2-4 8.5C3 16.6 6.8 21 12 21s9-4.4 9-9.5c0-3.3-1.5-6.5-4-8.5-.3 2.8-1.6 4.4-3 5.5-1.6 1.3-2.8 2.6-2.8 5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span>
        <span class="brand-title">HepaVision</span>
        <span class="brand-sub">Diagnostic Console</span>
      </span>
    </a>

    <nav class="nav-group">
      <span class="nav-label">Navigate</span>
      <a href="{{ url_for('dashboard') }}" class="nav-item {{ 'active' if active=='dashboard' else '' }}">
        <i class="bi bi-grid-1x2"></i><span>Dashboard</span>
      </a>
      <a href="{{ url_for('analysis') }}" class="nav-item {{ 'active' if active=='analysis' else '' }}">
        <i class="bi bi-cloud-upload"></i><span>CT Analysis</span>
      </a>
      <a href="{{ url_for('report') }}" class="nav-item {{ 'active' if active=='report' else '' }}">
        <i class="bi bi-file-earmark-medical"></i><span>Report</span>
      </a>
      <a href="{{ url_for('about') }}" class="nav-item {{ 'active' if active=='about' else '' }}">
        <i class="bi bi-info-circle"></i><span>About</span>
      </a>
    </nav>

    <div class="sidebar-status">
      <span class="nav-label">System</span>
      <div class="status-row">
        <span class="status-dot {{ 'online' if models_ready else 'offline' }}"></span>
        <span>{{ 'Models Online' if models_ready else 'Models Offline' }}</span>
      </div>
      <div class="status-row muted">
        <i class="bi bi-cpu"></i><span>TensorFlow &middot; U-Net x2</span>
      </div>
    </div>
  </aside>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>
</div>

<div id="loadingOverlay" class="loading-overlay">
  <div class="scan-box">
    <div class="scan-line"></div>
    <i class="bi bi-file-earmark-medical scan-icon"></i>
  </div>
  <p class="loading-text">Running segmentation pipeline&hellip;</p>
  <p class="loading-sub" id="loadingStep">Loading AI models</p>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
